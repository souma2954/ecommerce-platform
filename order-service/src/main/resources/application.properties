spring.application.name=order-service
spring.config.import=optional:configserver:http://localhost:8888
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# Enable Micrometer tracing
management.tracing.sampling.probability=1.0   
# 100% tracing, reduce to 0.1 in prod

# Zipkin endpoint (make sure Zipkin is running on 9411)
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Show traceId & spanId in logs for correlation
logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]